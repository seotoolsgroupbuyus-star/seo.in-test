settings:
  content:
    merge: true

media:
  input: public/media
  output: /media
content:
  - name: products
    label: Products
    type: collection
    path: content/products
    filename: '{primary}.json'
    view:
      primary: slug
    operations:
      create: false
      delete: false
      rename: false
    format: json
    fields:
      - name: slug
        label: Slug
        type: string
        required: true
        readonly: true

      - name: name
        label: Product Name
        type: string
      - name: domain
        label: Tool Domain
        type: string
      - name: imageUrl
        label: Optional Tool Image (upload)
        type: image
      - name: category
        label: Category
        type: string
      - name: priceMonthly
        label: Monthly Price USD
        type: number
      - name: priceYearly
        label: Yearly Price USD
        type: number
      - name: buyHref
        label: Existing Checkout URL
        type: string
      - name: title
        label: SEO Title Override (optional)
        type: string
      - name: description
        label: Meta Description Override (optional)
        type: text
      - name: shortDesc
        label: Product Intro Override (optional)
        type: text
  - name: pages
    label: Pages and Blog Articles
    type: collection
    path: content/pages
    filename: '{primary}.json'
    view:
      primary: slug
    operations:
      create: false
      delete: false
      rename: false
    format: json
    fields:
      - name: slug
        label: Original URL Slug
        type: string
        readonly: true
      - name: heading
        label: Heading
        type: string
      - name: title
        label: SEO Title Override (optional)
        type: string
      - name: seoDescription
        label: SEO Description Override (optional)
        type: text
      - name: kind
        label: Page Type
        type: select
        options:
          - label: Page
            value: static
          - label: Blog
            value: blog
      - name: paragraphs
        label: Original Article Paragraphs
        type: text
        list: true
  - name: homepage
    label: Homepage Hero Content
    type: file
    path: content/homepage.json
    format: json
    fields:
      - name: badge
        label: Hero Badge
        type: string
      - name: heading
        label: Hero Heading
        type: string
      - name: headingAccent
        label: Hero Highlighted Heading
        type: string
      - name: description
        label: Hero Description
        type: text
      - name: primaryButton
        label: Primary Button Text
        type: string
      - name: secondaryButton
        label: Secondary Button Text
        type: string
      - { name: primaryUrl, label: Primary Button URL, type: string }
      - { name: secondaryUrl, label: Secondary Button URL, type: string }
      - { name: seoTitle, label: Homepage SEO Title, type: string }
      - { name: seoDescription, label: Homepage Meta Description, type: text }

  - name: section_seo
    label: All Tools, Blog, Pricing and FAQ SEO
    type: file
    path: content/section-seo.json
    format: json
    fields:
      - name: all-tools
        label: All Tools SEO
        type: object
        fields:
          - { name: title, label: SEO Page Title, type: string }
          - { name: description, label: Meta Description, type: text }
      - name: blog
        label: Blog SEO
        type: object
        fields:
          - { name: title, label: SEO Page Title, type: string }
          - { name: description, label: Meta Description, type: text }
      - name: pricing
        label: Pricing SEO
        type: object
        fields:
          - { name: title, label: SEO Page Title, type: string }
          - { name: description, label: Meta Description, type: text }
      - name: faq
        label: FAQ SEO
        type: object
        fields:
          - { name: title, label: SEO Page Title, type: string }
          - { name: description, label: Meta Description, type: text }
  - name: pricing_plans
    label: Pricing Plans
    type: file
    path: content/plans.json
    format: json
    fields:
      - name: plans
        label: Six Pricing Plans
        type: object
        list: true
        fields:
          - { name: name, label: Plan Name, type: string }
          - { name: price, label: Monthly Price USD, type: string }
          - { name: popular, label: Highlight as Popular Plan, type: boolean }
          - { name: color, label: Plan Accent (blue/purple), type: string }
          - { name: description, label: Plan Description, type: text }
          - { name: buyNowHref, label: Existing Checkout URL, type: string }
          - { name: features, label: Included Features, type: string, list: true }
  - name: faqs
    label: Frequently Asked Questions
    type: file
    path: content/faqs.json
    format: json
    fields:
      - name: faqs
        label: Questions and Answers
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Answer, type: text }

  - name: site_settings
    label: Site Header and Footer
    type: file
    path: content/site.json
    format: json
    fields:
      - name: header
        label: Header and Mobile Menu
        type: object
        fields:
          - { name: brand, label: Website Brand Name, type: string }
          - { name: logoUrl, label: Optional Brand Logo (upload), type: image }
          - { name: loginText, label: Login Button Text, type: string }
          - { name: loginUrl, label: Login Button URL, type: string }
          - { name: signupText, label: Signup Button Text, type: string }
          - { name: signupUrl, label: Signup Button URL, type: string }
          - name: links
            label: Menu Links
            type: object
            list: true
            fields:
              - { name: label, label: Link Text, type: string }
              - { name: url, label: Destination URL, type: string }
      - name: footer
        label: Footer
        type: object
        fields:
          - { name: brand, label: Footer Brand, type: string }
          - { name: tagline, label: Short Tagline, type: string }
          - { name: description, label: Footer Description, type: text }
          - { name: newsletterHeading, label: Newsletter Heading, type: string }
          - { name: newsletterDescription, label: Newsletter Description, type: text }
          - name: quickLinks
            label: Footer Links
            type: object
            list: true
            fields:
              - { name: label, label: Link Text, type: string }
              - { name: url, label: Destination URL, type: string }
          - name: legalLinks
            label: Legal Links
            type: object
            list: true
            fields:
              - { name: label, label: Link Text, type: string }
              - { name: url, label: Destination URL, type: string }

  - name: home_sections
    label: Homepage - Testimonials, Features, Steps and Logos
    type: file
    path: content/home-sections.json
    format: json
    fields:
      - name: testimonials
        label: Customer testimonials
        type: object
        fields:
          - { name: heading, label: Section Heading, type: string }
          - { name: description, label: Section Intro, type: text }
          - { name: subheading, label: Reviews Heading, type: string }
          - name: items
            label: Reviews
            type: object
            list:
              collapsible: { collapsed: true, summary: "{name}" }
            fields:
              - { name: name, label: Customer Name, type: string }
              - { name: role, label: Customer Role, type: string }
              - { name: content, label: Review Text, type: text }
              - { name: rating, label: Star Rating, type: number }
      - name: process
        label: How It Works
        type: object
        fields:
          - { name: heading, label: Section Heading, type: string }
          - { name: description, label: Section Intro, type: text }
          - name: steps
            label: Steps
            type: object
            list:
              collapsible: { collapsed: true, summary: "{title}" }
            fields:
              - { name: title, label: Step Heading, type: string }
              - { name: description, label: Step Description, type: text }
      - name: logoCloud
        label: Supported Tools
        type: object
        fields:
          - { name: heading, label: Section Heading, type: string }
          - name: logos
            label: Tool Logos
            type: object
            list:
              collapsible: { collapsed: true, summary: "{name}" }
            fields:
              - { name: name, label: Tool Name, type: string }
              - { name: domain, label: Logo Source Domain, type: string }

  - name: home_extras
    label: Homepage - Comparisons, Benefits, Access and Status
    type: file
    path: content/home-extras.json
    format: json
    fields:
      - name: whyChoose
        label: Why Choose Us
        type: object
        fields:
          - { name: heading, label: Section Heading, type: string }
          - name: items
            label: Cards
            type: object
            list: { collapsible: { collapsed: true, summary: "{title}" } }
            fields:
              - { name: title, label: Card Heading, type: string }
              - { name: description, label: Description, type: text }
      - name: priceComparison
        label: Price Comparison
        type: object
        fields:
          - { name: heading, label: Section Heading, type: string }
          - { name: description, label: Intro Description, type: text }
          - name: cards
            label: Comparison Benefits
            type: object
            list: { collapsible: { collapsed: true, summary: "{heading}" } }
            fields:
              - { name: heading, label: Heading, type: string }
              - { name: description, label: Description, type: text }
          - name: tools
            label: Compared Tools
            type: object
            list: { collapsible: { collapsed: true, summary: "{name}" } }
            fields:
              - { name: name, label: Tool Name, type: string }
              - { name: original, label: Individual Price, type: number }
              - { name: our, label: Group Buy Value, type: string }
      - name: access
        label: Access Showcase
        type: object
        fields:
          - { name: badge, label: Badge, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: description, label: Description, type: text }
          - name: items
            label: Cards
            type: object
            list: { collapsible: { collapsed: true, summary: "{title}" } }
            fields:
              - { name: title, label: Card Heading, type: string }
              - { name: description, label: Description, type: text }
      - name: status
        label: System Status
        type: object
        fields:
          - { name: badge, label: Status Badge, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: description, label: Description, type: text }
          - { name: averageUptime, label: Average Uptime, type: string }
          - { name: averageLatency, label: Average Latency, type: string }
          - { name: supportedHeading, label: Tools Heading, type: string }
          - name: tools
            label: Tool Status Rows
            type: object
            list: { collapsible: { collapsed: true, summary: "{name}" } }
            fields:
              - { name: name, label: Tool, type: string }
              - { name: status, label: Status, type: string }
              - { name: latency, label: Latency, type: string }
              - { name: uptime, label: Uptime, type: string }
              - { name: load, label: Load %, type: number }
      - name: toolGrid
        label: Tool Collection
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: description, label: Description, type: text }
          - { name: searchPlaceholder, label: Search Placeholder, type: string }
      - name: faqIntro
        label: FAQ Introduction
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: description, label: Description, type: text }

  - name: product_details
    label: Product Detail Cards and Benefit Tables (52 Products)
    type: file
    path: content/product-details.json
    format: json
    fields:
      - name: products
        label: Individually Editable Product Details
        type: object
        list: { collapsible: { collapsed: true, summary: "{name}" } }
        fields:
          - { name: slug, label: Product URL Slug, type: string, readonly: true }
          - { name: name, label: Product Name (reference), type: string, readonly: true }
          - { name: teamDescription, label: Why Teams Use This Tool, type: text }
          - name: benefitRows
            label: Pricing and Features Benefit Table
            type: object
            list: { collapsible: { collapsed: true, summary: "{benefit}" } }
            fields:
              - { name: benefit, label: Benefit Name, type: string }
              - { name: helps, label: How It Helps, type: text }
          - name: keyBenefits
            label: Key Benefit Cards
            type: object
            list: { collapsible: { collapsed: true, summary: "{title}" } }
            fields:
              - { name: title, label: Card Heading, type: string }
              - { name: body, label: Card Description, type: text }

  - name: ui_labels
    label: Homepage - Small Labels, Status and CTA Buttons
    type: file
    path: content/ui-labels.json
    format: json
    fields:
      - name: product
        label: Product Page Headings, Breadcrumbs and Tables
        type: object
        fields:
          - { name: buyNow, label: Buy Button, type: string }
          - { name: pricingHeading, label: Pricing Section Heading, type: string }
          - { name: planColumn, label: Plan Column, type: string }
          - { name: priceColumn, label: Price Column, type: string }
          - { name: monthly, label: Monthly Row, type: string }
          - { name: yearly, label: Yearly Row, type: string }
          - { name: monthSuffix, label: Per Month, type: string }
          - { name: yearSuffix, label: Per Year, type: string }
          - { name: benefitColumn, label: Benefit Column, type: string }
          - { name: helpsColumn, label: Benefits Detail Column, type: string }
          - { name: whatIsPrefix, label: What Is Prefix, type: string }
          - { name: overview, label: Overview Card, type: string }
          - { name: whyTeams, label: Why Teams Card, type: string }
          - { name: keyBenefitsPrefix, label: Key Benefits Prefix, type: string }
          - { name: homeCrumb, label: Home Breadcrumb, type: string }
          - { name: toolsCrumb, label: Tools Breadcrumb, type: string }
      - name: allTools
        label: All Tools Directory
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: introBefore, label: Intro Before Count, type: string }
          - { name: introAfter, label: Intro After Count, type: string }
          - { name: searchPlaceholder, label: Search Placeholder, type: string }
      - name: chat
        label: Floating Chat Widget
        type: object
        fields:
          - { name: heading, label: Chat Heading, type: string }
          - { name: replyTime, label: Reply Time, type: string }
          - { name: whatsappLabel, label: WhatsApp Label, type: string }
          - { name: whatsappDescription, label: WhatsApp Subtitle, type: string }
          - { name: facebookLabel, label: Facebook Label, type: string }
          - { name: facebookDescription, label: Facebook Subtitle, type: string }
          - { name: notConfigured, label: Missing Link Label, type: string }
          - { name: tip, label: Keyboard Tip, type: string }
          - { name: tipSuffix, label: Keyboard Tip Suffix, type: string }
          - { name: openText, label: Open Button, type: string }
          - { name: closeText, label: Close Button, type: string }
          - { name: channels, label: Channel Text, type: string }
          - { name: whatsappUrl, label: WhatsApp URL, type: string }
          - { name: facebookUrl, label: Facebook URL, type: string }
      - name: pricing
        label: Pricing Section UI
        type: object
        fields:
          - { name: heading, label: Section Heading, type: string }
          - { name: description, label: Introduction, type: text }
          - { name: available, label: Available Plans, type: string }
          - { name: popular, label: Popular Badge, type: string }
          - { name: perMonth, label: Monthly Label, type: string }
          - { name: buyNow, label: Buy Button, type: string }
      - name: hero
        label: Member Portal Preview
        type: object
        fields:
          - { name: portalTitle, label: Portal Preview Title, type: string }
          - { name: liveStatus, label: Live Badge, type: string }
          - { name: accessLabel, label: Access Caption, type: string }
          - { name: savingsLabel, label: Savings Caption, type: string }
          - { name: savingsValue, label: Savings Amount, type: string }
          - { name: uptimeLabel, label: Uptime Caption, type: string }
          - { name: uptimeValue, label: Uptime Value, type: string }
          - name: tools
            label: Preview Tool Cards
            type: object
            list: { collapsible: { collapsed: true, summary: "{name}" } }
            fields:
              - { name: name, label: Tool Name, type: string }
              - { name: domain, label: Tool Logo Domain, type: string }
      - name: comparison
        label: Savings Comparison Table
        type: object
        fields:
          - { name: toolColumn, label: Table Tool Column, type: string }
          - { name: originalColumn, label: Original Price Column, type: string }
          - { name: groupColumn, label: Our Price Column, type: string }
          - { name: totalLabel, label: Total Value Label, type: string }
          - { name: offerPrice, label: Offer Price, type: string }
          - { name: savingBadge, label: Savings Badge, type: string }
          - { name: savingFoot, label: Savings Footer, type: string }
          - { name: cta, label: Signup CTA Text, type: string }
          - { name: ctaUrl, label: Signup CTA URL, type: string }
      - name: access
        label: Access Preview
        type: object
        fields:
          - { name: cta, label: CTA Text, type: string }
          - { name: ctaUrl, label: CTA URL, type: string }
          - { name: extensionTitle, label: Extension Heading, type: string }
          - { name: extensionBadge, label: Extension Status, type: string }
          - name: tools
            label: Extension Tool Cards
            type: object
            list: { collapsible: { collapsed: true, summary: "{name}" } }
            fields:
              - { name: name, label: Tool Name, type: string }
              - { name: domain, label: Tool Logo Domain, type: string }
      - name: status
        label: Server Status Labels
        type: object
        fields:
          - { name: uptimeLabel, label: Uptime Caption, type: string }
          - { name: latencyLabel, label: Latency Caption, type: string }
          - { name: responseLabel, label: Response Time Caption, type: string }
          - { name: uptime30Label, label: Uptime 30d Caption, type: string }
          - { name: loadLabel, label: Load Caption, type: string }
          - name: cards
            label: Status Information Cards
            type: object
            list: { collapsible: { collapsed: true, summary: "{heading}" } }
            fields:
              - { name: heading, label: Heading, type: string }
              - { name: description, label: Description, type: text }
      - name: tools
        label: Tool Request Section
        type: object
        fields:
          - { name: requestHeading, label: Tool Request Heading, type: string }
          - { name: requestDescription, label: Request Description, type: text }
          - { name: viewButton, label: View Tools CTA, type: string }
          - { name: requestButton, label: Request CTA, type: string }
          - { name: viewUrl, label: View Tools URL, type: string }
          - { name: requestUrl, label: Request URL, type: string }
