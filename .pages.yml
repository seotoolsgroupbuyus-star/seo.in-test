media:
  input: public/media
  output: /media
content:
  - name: products
    label: Products
    type: collection
    path: content/products
    filename: '{primary}.json'
    view:
      primary: slug
    operations:
      create: false
      delete: false
      rename: false
    format: json
    fields:
      - name: slug
        label: Slug
        type: string
        required: true
      - name: name
        label: Product Name
        type: string
      - name: domain
        label: Tool Domain
        type: string
      - name: imageUrl
        label: Optional Tool Image (upload)
        type: image
      - name: category
        label: Category
        type: string
      - name: priceMonthly
        label: Monthly Price USD
        type: number
      - name: priceYearly
        label: Yearly Price USD
        type: number
      - name: buyHref
        label: Existing Checkout URL
        type: string
      - name: title
        label: SEO Title Override (optional)
        type: string
      - name: description
        label: Meta Description Override (optional)
        type: text
      - name: shortDesc
        label: Product Intro Override (optional)
        type: text
  - name: pages
    label: Pages and Blog Articles
    type: collection
    path: content/pages
    filename: '{primary}.json'
    view:
      primary: slug
    operations:
      create: false
      delete: false
      rename: false
    format: json
    fields:
      - name: slug
        label: Original URL Slug
        type: string
      - name: heading
        label: Heading
        type: string
      - name: title
        label: SEO Title Override (optional)
        type: string
      - name: seoDescription
        label: SEO Description Override (optional)
        type: text
      - name: kind
        label: Page Type
        type: select
        options:
          - label: Page
            value: static
          - label: Blog
            value: blog
      - name: paragraphs
        label: Original Article Paragraphs
        type: text
        list: true
  - name: homepage
    label: Homepage Hero Content
    type: file
    path: content/homepage.json
    format: json
    fields:
      - name: badge
        label: Hero Badge
        type: string
      - name: heading
        label: Hero Heading
        type: string
      - name: headingAccent
        label: Hero Highlighted Heading
        type: string
      - name: description
        label: Hero Description
        type: text
      - name: primaryButton
        label: Primary Button Text
        type: string
      - name: secondaryButton
        label: Secondary Button Text
        type: string

  - name: pricing_plans
    label: Pricing Plans
    type: file
    path: content/plans.json
    format: json
    fields:
      - name: plans
        label: Six Pricing Plans
        type: object
        list: true
        fields:
          - { name: name, label: Plan Name, type: string }
          - { name: price, label: Monthly Price USD, type: string }
          - { name: description, label: Plan Description, type: text }
          - { name: buyNowHref, label: Existing Checkout URL, type: string }
          - { name: features, label: Included Features, type: string, list: true }
  - name: faqs
    label: Frequently Asked Questions
    type: file
    path: content/faqs.json
    format: json
    fields:
      - name: faqs
        label: Questions and Answers
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Answer, type: text }

  - name: site_settings
    label: Site Header and Footer
    type: file
    path: content/site.json
    format: json
    fields:
      - name: header
        label: Header and Mobile Menu
        type: object
        fields:
          - { name: brand, label: Website Brand Name, type: string }
          - { name: logoUrl, label: Optional Brand Logo (upload), type: image }
          - { name: loginText, label: Login Button Text, type: string }
          - { name: loginUrl, label: Login Button URL, type: string }
          - { name: signupText, label: Signup Button Text, type: string }
          - { name: signupUrl, label: Signup Button URL, type: string }
          - name: links
            label: Menu Links
            type: object
            list: true
            fields:
              - { name: label, label: Link Text, type: string }
              - { name: url, label: Destination URL, type: string }
      - name: footer
        label: Footer
        type: object
        fields:
          - { name: brand, label: Footer Brand, type: string }
          - { name: tagline, label: Short Tagline, type: string }
          - { name: description, label: Footer Description, type: text }
          - { name: newsletterHeading, label: Newsletter Heading, type: string }
          - { name: newsletterDescription, label: Newsletter Description, type: text }
          - name: quickLinks
            label: Footer Links
            type: object
            list: true
            fields:
              - { name: label, label: Link Text, type: string }
              - { name: url, label: Destination URL, type: string }
          - name: legalLinks
            label: Legal Links
            type: object
            list: true
            fields:
              - { name: label, label: Link Text, type: string }
              - { name: url, label: Destination URL, type: string }

  - name: home_sections
    label: Homepage - Testimonials, Features, Steps and Logos
    type: file
    path: content/home-sections.json
    format: json
    fields:
      - name: testimonials
        label: Customer testimonials
        type: object
        fields:
          - { name: heading, label: Section Heading, type: string }
          - { name: description, label: Section Intro, type: text }
          - { name: subheading, label: Reviews Heading, type: string }
          - name: items
            label: Reviews
            type: object
            list:
              collapsible: { collapsed: true, summary: "{name}" }
            fields:
              - { name: name, label: Customer Name, type: string }
              - { name: role, label: Customer Role, type: string }
              - { name: content, label: Review Text, type: text }
              - { name: rating, label: Star Rating, type: number }
      - name: features
        label: Benefits
        type: object
        fields:
          - name: items
            label: Benefits
            type: object
            list:
              collapsible: { collapsed: true, summary: "{title}" }
            fields:
              - { name: title, label: Heading, type: string }
              - { name: description, label: Description, type: text }
      - name: process
        label: How It Works
        type: object
        fields:
          - { name: heading, label: Section Heading, type: string }
          - { name: description, label: Section Intro, type: text }
          - name: steps
            label: Steps
            type: object
            list:
              collapsible: { collapsed: true, summary: "{title}" }
            fields:
              - { name: title, label: Step Heading, type: string }
              - { name: description, label: Step Description, type: text }
      - name: logoCloud
        label: Supported Tools
        type: object
        fields:
          - { name: heading, label: Section Heading, type: string }
          - name: logos
            label: Tool Logos
            type: object
            list:
              collapsible: { collapsed: true, summary: "{name}" }
            fields:
              - { name: name, label: Tool Name, type: string }
              - { name: domain, label: Logo Source Domain, type: string }
