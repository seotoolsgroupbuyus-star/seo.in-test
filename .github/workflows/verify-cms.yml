name: Verify Pages CMS edits and Astro output
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'src/**'
      - 'astro/**'
      - '.pages.yml'
      - 'scripts/verify-cms-editing.mjs'
      - '.github/workflows/verify-cms.yml'
permissions:
  contents: read
jobs:
  cms:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Pages CMS YAML and ten collections
        run: |
          ruby -e 'require "yaml"; y=YAML.load_file(".pages.yml", aliases: true); c=y.fetch("content"); abort "Expected ten CMS editors" unless c.size==10; abort "CMS merge protection disabled" unless y.dig("settings","content","merge") == true; puts "CMS YAML and all ten editors valid"'
      - name: Check CMS source records and fields
        run: node scripts/verify-cms-editing.mjs validate
      - name: Simulate CMS content changes (CI only)
        run: node scripts/verify-cms-editing.mjs prepare
      - name: Install and build Astro
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Check edited content and SEO in prerendered pages
        run: node scripts/verify-cms-editing.mjs check
